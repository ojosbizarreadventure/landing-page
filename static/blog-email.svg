<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="emailBg" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="colabGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#DC2626" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="emailGlowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#emailBg)"/>

  <!-- Crossed-out envelope in background -->
  <g transform="translate(600, 280)" opacity="0.12">
    <!-- Envelope body -->
    <rect x="-120" y="-60" width="240" height="150" rx="8" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <!-- Envelope flap -->
    <path d="M-120,-60 L0,30 L120,-60" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <!-- X cross-out -->
    <line x1="-140" y1="-80" x2="140" y2="110" stroke="#DC2626" stroke-width="6" opacity="0.8"/>
    <line x1="140" y1="-80" x2="-140" y2="110" stroke="#DC2626" stroke-width="6" opacity="0.8"/>
  </g>

  <!-- Central collaboration glow -->
  <circle cx="600" cy="320" r="150" fill="url(#colabGlow)"/>

  <!-- Interaction connection ring -->
  <circle cx="600" cy="330" r="110" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="600" cy="330" r="130" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Connection lines between people -->
  <g filter="url(#emailGlowF)">
    <line x1="510" y1="310" x2="690" y2="310" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
    <line x1="510" y1="310" x2="560" y2="430" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
    <line x1="690" y1="310" x2="640" y2="430" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
    <line x1="510" y1="310" x2="640" y2="430" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="690" y1="310" x2="560" y2="430" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="600" y1="210" x2="510" y2="310" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
    <line x1="600" y1="210" x2="690" y2="310" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
    <line x1="600" y1="210" x2="560" y2="430" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="600" y1="210" x2="640" y2="430" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>

  <!-- Interaction bubbles -->
  <g>
    <!-- Bubble between person 1 and 2 (top) -->
    <g filter="url(#emailGlowF)">
      <rect x="530" y="245" width="50" height="28" rx="14" fill="rgba(220,38,38,0.25)" stroke="#DC2626" stroke-width="1" opacity="0.8"/>
      <circle cx="545" cy="259" r="3" fill="rgba(255,255,255,0.6)"/>
      <circle cx="555" cy="259" r="3" fill="rgba(255,255,255,0.6)"/>
      <circle cx="565" cy="259" r="3" fill="rgba(255,255,255,0.6)"/>
    </g>
    <!-- Bubble between person 2 and 3 -->
    <g filter="url(#emailGlowF)">
      <rect x="660" y="355" width="50" height="28" rx="14" fill="rgba(220,38,38,0.2)" stroke="#DC2626" stroke-width="1" opacity="0.7"/>
      <circle cx="675" cy="369" r="3" fill="rgba(255,255,255,0.5)"/>
      <circle cx="685" cy="369" r="3" fill="rgba(255,255,255,0.5)"/>
      <circle cx="695" cy="369" r="3" fill="rgba(255,255,255,0.5)"/>
    </g>
    <!-- Bubble on left side -->
    <g>
      <rect x="440" y="355" width="45" height="26" rx="13" fill="rgba(220,38,38,0.15)" stroke="#DC2626" stroke-width="1" opacity="0.6"/>
      <circle cx="453" cy="368" r="2.5" fill="rgba(255,255,255,0.5)"/>
      <circle cx="462" cy="368" r="2.5" fill="rgba(255,255,255,0.5)"/>
      <circle cx="471" cy="368" r="2.5" fill="rgba(255,255,255,0.5)"/>
    </g>
  </g>

  <!-- Person 1: Top center -->
  <g>
    <circle cx="600" cy="183" r="14" fill="rgba(255,255,255,0.85)"/>
    <path d="M582,202 Q582,198 586,198 L614,198 Q618,198 618,202 L616,232 Q616,236 612,236 L588,236 Q584,236 584,232 Z" fill="rgba(255,255,255,0.7)"/>
    <!-- Arms out welcoming -->
    <path d="M582,208 L565,218" stroke="rgba(255,255,255,0.6)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M618,208 L635,218" stroke="rgba(255,255,255,0.6)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="588" y="236" width="11" height="18" rx="3" fill="rgba(255,255,255,0.55)"/>
    <rect x="601" y="236" width="11" height="18" rx="3" fill="rgba(255,255,255,0.55)"/>
  </g>

  <!-- Person 2: Left -->
  <g>
    <circle cx="510" cy="283" r="14" fill="rgba(255,255,255,0.8)"/>
    <path d="M492,302 Q492,298 496,298 L524,298 Q528,298 528,302 L526,332 Q526,336 522,336 L498,336 Q494,336 494,332 Z" fill="rgba(255,255,255,0.65)"/>
    <path d="M492,308 L478,320" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M528,308 L540,300" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="498" y="336" width="11" height="17" rx="3" fill="rgba(255,255,255,0.5)"/>
    <rect x="511" y="336" width="11" height="17" rx="3" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- Person 3: Right -->
  <g>
    <circle cx="690" cy="283" r="14" fill="rgba(255,255,255,0.8)"/>
    <path d="M672,302 Q672,298 676,298 L704,298 Q708,298 708,302 L706,332 Q706,336 702,336 L678,336 Q674,336 674,332 Z" fill="rgba(255,255,255,0.65)"/>
    <path d="M672,308 L660,300" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M708,308 L722,320" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="678" y="336" width="11" height="17" rx="3" fill="rgba(255,255,255,0.5)"/>
    <rect x="691" y="336" width="11" height="17" rx="3" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- Person 4: Bottom center-left -->
  <g>
    <circle cx="560" cy="405" r="13" fill="rgba(255,255,255,0.7)"/>
    <path d="M544,422 Q544,418 548,418 L572,418 Q576,418 576,422 L574,448 Q574,452 570,452 L550,452 Q546,452 546,448 Z" fill="rgba(255,255,255,0.55)"/>
    <rect x="549" y="452" width="10" height="16" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="561" y="452" width="10" height="16" rx="3" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Person 5 (partial): Bottom center-right -->
  <g>
    <circle cx="640" cy="405" r="13" fill="rgba(255,255,255,0.7)"/>
    <path d="M624,422 Q624,418 628,418 L652,418 Q656,418 656,422 L654,448 Q654,452 650,452 L630,452 Q626,452 626,448 Z" fill="rgba(255,255,255,0.55)"/>
    <rect x="629" y="452" width="10" height="16" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="641" y="452" width="10" height="16" rx="3" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Forward arrows at the bottom suggesting progress -->
  <g opacity="0.25" transform="translate(600, 540)">
    <path d="M-40,0 L0,-15 L40,0" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    <path d="M-30,12 L0,0 L30,12" fill="none" stroke="#DC2626" stroke-width="2" opacity="0.6"/>
    <path d="M-20,22 L0,13 L20,22" fill="none" stroke="#DC2626" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Decorative dots -->
  <g opacity="0.25">
    <circle cx="120" cy="100" r="2" fill="white"/>
    <circle cx="1080" cy="90" r="2" fill="white"/>
    <circle cx="80" cy="500" r="1.5" fill="white"/>
    <circle cx="1120" cy="520" r="1.5" fill="white"/>
    <circle cx="300" cy="300" r="1.5" fill="#DC2626"/>
    <circle cx="900" cy="280" r="1.5" fill="#DC2626"/>
  </g>

  <!-- Corner accents -->
  <g opacity="0.15">
    <line x1="30" y1="30" x2="120" y2="30" stroke="#DC2626" stroke-width="2"/>
    <line x1="30" y1="30" x2="30" y2="120" stroke="#DC2626" stroke-width="2"/>
    <line x1="1170" y1="600" x2="1080" y2="600" stroke="#DC2626" stroke-width="2"/>
    <line x1="1170" y1="600" x2="1170" y2="510" stroke="#DC2626" stroke-width="2"/>
  </g>
</svg>
