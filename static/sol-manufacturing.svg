<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="An order travelling through four production stations, turning from turquoise to amber as it is made">
  <defs>
    <!-- Ground: onyx floor with a deep teal pool of light -->
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16333A"/>
      <stop offset="45%" stop-color="#102227"/>
      <stop offset="100%" stop-color="#0B0D0D"/>
    </linearGradient>

    <!-- Light source, top-left -->
    <radialGradient id="keyLight" cx="18%" cy="6%" r="72%">
      <stop offset="0%" stop-color="#00D2D8" stop-opacity=".38"/>
      <stop offset="55%" stop-color="#00A3A8" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#00A3A8" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber heat at the transformation end -->
    <radialGradient id="heat" cx="84%" cy="74%" r="58%">
      <stop offset="0%" stop-color="#FC7326" stop-opacity=".40"/>
      <stop offset="60%" stop-color="#FC7326" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#FC7326" stop-opacity="0"/>
    </radialGradient>

    <!-- The chain: raw material in, finished goods out -->
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16C7CC"/>
      <stop offset="38%" stop-color="#00A3A8"/>
      <stop offset="68%" stop-color="#FC7326"/>
      <stop offset="100%" stop-color="#FF9552"/>
    </linearGradient>

    <linearGradient id="tqFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FE3E6"/>
      <stop offset="100%" stop-color="#00A3A8"/>
    </linearGradient>
    <linearGradient id="amFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9552"/>
      <stop offset="100%" stop-color="#E05E14"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C3A40"/>
      <stop offset="100%" stop-color="#122A2F"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D0D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B0D0D" stop-opacity=".8"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E9F4F4" opacity=".07"/>
    </pattern>
  </defs>

  <!-- ── Canvas ── -->
  <rect width="1200" height="520" fill="url(#floor)"/>
  <rect width="1200" height="520" fill="url(#grid)"/>
  <rect width="1200" height="520" fill="url(#keyLight)"/>
  <rect width="1200" height="520" fill="url(#heat)"/>

  <!-- ── The chain, glowing beneath itself ── -->
  <path d="M60 300 C 220 300, 240 170, 400 170 S 620 350, 790 350 S 1010 210, 1150 210"
        fill="none" stroke="url(#chain)" stroke-width="16" opacity=".35" filter="url(#soft)"/>
  <path d="M60 300 C 220 300, 240 170, 400 170 S 620 350, 790 350 S 1010 210, 1150 210"
        fill="none" stroke="url(#chain)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ══ Station 1 · Order ══ -->
  <g transform="translate(180 262)">
    <ellipse cx="4" cy="66" rx="52" ry="9" fill="#000" opacity=".38" filter="url(#soft)"/>
    <rect x="-46" y="-6" width="92" height="66" rx="10" fill="url(#slab)" stroke="#16C7CC" stroke-opacity=".26"/>
    <rect x="-46" y="-6" width="92" height="2" rx="1" fill="#E9F4F4" opacity=".12"/>
    <rect x="-32" y="12" width="46" height="5" rx="2.5" fill="#5FE3E6" opacity=".85"/>
    <rect x="-32" y="26" width="62" height="5" rx="2.5" fill="#E9F4F4" opacity=".22"/>
    <rect x="-32" y="40" width="34" height="5" rx="2.5" fill="#E9F4F4" opacity=".16"/>
    <circle cx="0" cy="-24" r="9" fill="url(#tqFace)"/>
    <circle cx="0" cy="-24" r="9" fill="none" stroke="#5FE3E6" stroke-opacity=".5" filter="url(#glow)"/>
  </g>

  <!-- ══ Station 2 · Material ══ -->
  <g transform="translate(430 170)">
    <ellipse cx="4" cy="74" rx="60" ry="10" fill="#000" opacity=".40" filter="url(#soft)"/>
    <!-- stacked bar stock, lit from top-left -->
    <rect x="-52" y="30" width="104" height="18" rx="4" fill="#20444B" stroke="#16C7CC" stroke-opacity=".45"/>
    <rect x="-52" y="30" width="104" height="2" rx="1" fill="#5FE3E6" opacity=".22"/>
    <rect x="-44" y="10" width="88" height="18" rx="4" fill="#27565F" stroke="#16C7CC" stroke-opacity=".55"/>
    <rect x="-44" y="10" width="88" height="2" rx="1" fill="#5FE3E6" opacity=".3"/>
    <rect x="-36" y="-10" width="72" height="18" rx="4" fill="#2E6772" stroke="#16C7CC" stroke-opacity=".7"/>
    <rect x="-36" y="-10" width="72" height="2.5" rx="1.25" fill="#9FF0F2" opacity=".45"/>
    <!-- shortage flag: the one crimson note on the whole canvas -->
    <circle cx="46" cy="-18" r="8" fill="#E73A33"/>
    <circle cx="46" cy="-18" r="8" fill="none" stroke="#E73A33" stroke-opacity=".7" filter="url(#glow)"/>
    <rect x="44.6" y="-22" width="2.8" height="5.5" rx="1.4" fill="#0B0D0D"/>
    <circle cx="46" cy="-14" r="1.5" fill="#0B0D0D"/>
  </g>

  <!-- ══ Station 3 · Make — the transformation, where turquoise becomes amber ══ -->
  <g transform="translate(790 350)">
    <ellipse cx="6" cy="96" rx="86" ry="13" fill="#000" opacity=".45" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="74" fill="#FC7326" opacity=".16" filter="url(#soft)"/>
    <!-- outer ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#E9F4F4" stroke-opacity=".1" stroke-width="10"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#amFace)" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="300 90" transform="rotate(-118)"/>
    <!-- inner mass -->
    <circle cx="0" cy="0" r="38" fill="#122A2F" stroke="#FC7326" stroke-opacity=".3"/>
    <circle cx="-11" cy="-13" r="26" fill="#FF9552" opacity=".1"/>
    <!-- teeth: a machined edge, lit top-left -->
    <g fill="url(#amFace)">
      <rect x="-4.5" y="-80" width="9" height="16" rx="3"/>
      <rect x="-4.5" y="-80" width="9" height="16" rx="3" transform="rotate(60)"/>
      <rect x="-4.5" y="-80" width="9" height="16" rx="3" transform="rotate(120)"/>
      <rect x="-4.5" y="-80" width="9" height="16" rx="3" transform="rotate(180)"/>
      <rect x="-4.5" y="-80" width="9" height="16" rx="3" transform="rotate(240)"/>
      <rect x="-4.5" y="-80" width="9" height="16" rx="3" transform="rotate(300)"/>
    </g>
    <circle cx="0" cy="0" r="11" fill="url(#amFace)"/>
    <circle cx="-3" cy="-3" r="4" fill="#FFD3B4" opacity=".55"/>
  </g>

  <!-- ══ Station 4 · Ship ══ -->
  <g transform="translate(1080 210)">
    <ellipse cx="4" cy="62" rx="48" ry="8" fill="#000" opacity=".38" filter="url(#soft)"/>
    <!-- a crate, drawn in isometric so it reads as an object with volume -->
    <path d="M-42 12 L0 -12 L42 12 L42 44 L0 68 L-42 44 Z" fill="#122A2F" stroke="#FF9552" stroke-opacity=".3"/>
    <path d="M-42 12 L0 -12 L42 12 L0 36 Z" fill="url(#amFace)" opacity=".95"/>
    <path d="M0 36 L42 12 L42 44 L0 68 Z" fill="#E05E14" opacity=".55"/>
    <path d="M-42 12 L0 36 L0 68 L-42 44 Z" fill="#0F2126" opacity=".9"/>
    <path d="M-42 12 L0 -12 L42 12" fill="none" stroke="#FFD3B4" stroke-opacity=".4" stroke-width="1.5"/>
    <!-- done tick -->
    <circle cx="34" cy="-24" r="12" fill="url(#tqFace)"/>
    <path d="M28.5 -24.5 l4 4 l7.5 -7.5" fill="none" stroke="#062225" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── Travelling work orders: small cards riding the chain ── -->
  <g opacity=".9">
    <rect x="292" y="200" width="26" height="17" rx="4" fill="url(#tqFace)" opacity=".75"/>
    <rect x="600" y="272" width="26" height="17" rx="4" fill="url(#tqFace)" opacity=".6"/>
    <rect x="932" y="290" width="26" height="17" rx="4" fill="url(#amFace)" opacity=".8"/>
  </g>

  <!-- ── Floor haze, keeps the lower edge from reading as a hard cut ── -->
  <rect y="360" width="1200" height="160" fill="url(#haze)"/>
</svg>
